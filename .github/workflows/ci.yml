name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Toda segunda: CVEs novas aparecem sem nenhum commit nosso
  schedule:
    - cron: "0 9 * * 1"

# Mínimo por padrão; cada job pede só o que precisa
permissions:
  contents: read

# Actions fixadas por SHA de commit (tag pode ser reescrita; SHA não). O Dependabot atualiza.
# Trivy: binário oficial com checksum fixado, sem action de terceiros.
env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  SEMGREP_VERSION: "1.186.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Testes + SAST (SpotBugs/FindSecBugs)
        run: mvn -B -P seguranca verify

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Instalar Trivy (checksum verificado)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C /usr/local/bin trivy && rm trivy.tgz

      - name: "Trivy: dependências, segredos e misconfig"
        run: >
          trivy fs --exit-code 1 --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs target .

      - name: "Semgrep: SAST multi-linguagem"
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off --error \
            --config p/java --config p/owasp-top-ten --config p/secrets \
            --config p/dockerfile --config p/github-actions --config p/docker-compose \
            --exclude target .

      - name: Validar Caddyfile
        run: >
          docker run --rm -e DOMINIO=exemplo.com -e ACME_EMAIL=ci@exemplo.com
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          "$(grep -oP 'image: \Kcaddy:\S+' compose.yaml)"
          caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Validar compose.yaml
        env:
          DOMINIO: exemplo.com
          ACME_EMAIL: ci@exemplo.com
          GHCR_OWNER: ci
          API_TAG: v0.0.0
          POSTGRES_PASSWORD: x
          KEYCLOAK_DB_PASSWORD: x
          KEYCLOAK_ADMIN_USER: x
          KEYCLOAK_ADMIN_PASSWORD: x
          MIGRACAO_DB_PASSWORD: x
          API_DB_PASSWORD: x
        run: docker compose -f compose.yaml config -q && docker compose -f compose.dev.yaml config -q

  imagem:
    # Publica no GHCR só em tags vX.Y.Z (ADR-003: nada de "latest" em produção)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, seguranca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/${{ github.repository_owner }}/estoque-api:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, ainda sem publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          load: true
          tags: ${{ env.IMAGEM }}

      - name: Instalar Trivy (checksum verificado)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C /usr/local/bin trivy && rm trivy.tgz
      - name: "Trivy: imagem final (bloqueia a publicação se houver HIGH/CRITICAL com correção)"
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGEM"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        run: docker push "$IMAGEM"
